# swiftlint.yml

opt_in_rules:
  - indentation_width
  - literal_expression_end_indentation
  - closure_end_indentation
  - trailing_newline
  - attributes
  - closure_spacing
  - collection_alignment
  - contains_over_first_not_nil
  - discouraged_optional_boolean
  - empty_string
  - explicit_type_interface
  - fallthrough
  - file_header
  - first_where
  - implicitly_unwrapped_optional
  - joined_default_parameter
  - lower_acl_than_parent
  - missing_docs
  - operator_usage_whitespace
  - overridden_super_call
  - pattern_matching_keywords
  - prohibited_super_call
  - shorthand_operator
  - untyped_error_in_catch
  - vertical_whitespace_closing_braces
  - vertical_whitespace_opening_braces

analyzer_rules:
  - explicit_self

line_length:
  warning: 120
  error: 150

cyclomatic_complexity:
  warning: 10
  error: 15

type_body_length:
  warning: 250
  error: 300

function_body_length:
  warning: 40
  error: 50

file_length:
  warning: 400
  error: 500

# Whitelist specific folders to lint.
included:
  - .

# Exclude files or folders like auto-generated files or dependencies.
excluded:
  - Pods
  - Carthage
  - Generated
  - .build
  - Source/ThirdParty

# Enforce naming conventions.
identifier_name:
  min_length: 3
  max_length: 40
  excluded:
    - id
    - URL
    - JSON

type_name:
  min_length: 3
  max_length: 40

# Custom rules for enterprise projects.
custom_rules:

  no_todos:
    name: "No TODOs"
    regex: "(// TODO|// FIXME)"
    message: "Please resolve TODOs and FIXMEs before committing."
    severity: error

  magic_numbers:
    name: "Avoid Magic Numbers"
    regex: "\\b[0-9]+\\b"
    message: "Avoid magic numbers; define constants or enums instead."
    severity: warning
